<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outil – Claude Prime</title>
  <style>
    :root {
      --bg: #f7f5f2;
      --surface: #ffffff;
      --text: #1f1d1a;
      --muted: #6b665e;
      --accent: #c96442;
      --border: #e6e1d9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1917;
        --surface: #24221f;
        --text: #f1ede6;
        --muted: #a39d93;
        --accent: #e08a68;
        --border: #3a3733;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .container { max-width: 880px; margin: 0 auto; padding: 0 16px; }
    header { padding: 72px 0 48px; text-align: center; }
    header h1 { font-size: clamp(2rem, 6vw, 3.2rem); letter-spacing: -0.02em; }
    header h1 span { color: var(--accent); }
    header p { margin-top: 12px; color: var(--muted); font-size: 1.15rem; }
    section { margin-bottom: 48px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
    }
    .card p { color: var(--muted); }
    .back {
      display: inline-block;
      margin-top: 24px;
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }
    footer {
      border-top: 1px solid var(--border);
      padding: 24px 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header class="container">
    <h1>L'<span>outil</span></h1>
    <p>Un espace pour construire notre outil, prêt à être déployé sur Cloudflare.</p>
  </header>

  <main class="container">
    <section>
      <div class="card">
        <p>L'outil arrive bientôt ici.</p>
        <a class="back" href="index.html">← Retour à l'accueil</a>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">Claude Prime · Cours Vibe Coding &amp; IA</div>
  </footer>
</body>
</html>
