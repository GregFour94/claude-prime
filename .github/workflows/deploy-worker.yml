name: Déployer le Worker de formation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: formation
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Installer les dépendances du Worker
        run: npm ci
      - name: Déployer sur Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          manque=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Secret manquant::CLOUDFLARE_API_TOKEN est vide. Ajoute-le dans Settings > Environments > formation > Environment secrets (nom exact CLOUDFLARE_API_TOKEN)."
            manque=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Variable manquante::CLOUDFLARE_ACCOUNT_ID est vide. Ajoute-la dans Settings > Environments > formation > Environment variables (nom exact CLOUDFLARE_ACCOUNT_ID)."
            manque=1
          fi
          [ "$manque" -eq 0 ] || exit 1
          npx --no-install wrangler deploy
